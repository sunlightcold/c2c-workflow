name: Backend Image

on:
  push:
    branches: [main]
    paths:
      - "projects/backend/**"
      - ".github/workflows/backend-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY_IMAGE: ghcr.io/sunlightcold/c2c-workflow-backend

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.5.2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: projects/backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate backend
        run: |
          pnpm run lint:server
          pnpm run typecheck:server
          pnpm run test:server
          pnpm run build
          pnpm run monorepo:check

      - name: Verify deployment bundle
        run: |
          test -s output/volumes/apps/admin/main.js
          test -s output/volumes/apps/migrate/main.js
          test -s output/compose.yaml
          test -s output/backup.sh
          test -s output/README.md
          test -s output/.env.example
          test -s output.zip

      - name: Upload server deployment files
        uses: actions/upload-artifact@v4
        with:
          name: c2c-backend-deploy-${{ github.sha }}
          path: projects/backend/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long
          labels: |
            org.opencontainers.image.title=C2C Workflow Backend
            org.opencontainers.image.description=C2C backend API and database migration runner

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: projects/backend
          file: projects/backend/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
