name: c2c-production

x-backend-image: &backend-image
  image: ${C2C_BACKEND_IMAGE:-ghcr.io/sunlightcold/c2c-workflow-backend:latest}
  pull_policy: ${C2C_PULL_POLICY:-always}
  build:
    context: .
    dockerfile: Dockerfile
    args:
      C2C_RUNTIME_IMAGE: ${C2C_RUNTIME_IMAGE:-c2c-workflow-backend-runtime:local}

x-backend-env-files: &backend-env-files
  - ${C2C_RUNTIME_ENV_FILE:-.env}

x-backend-environment: &backend-environment
  NODE_ENV: production
  C2C_BACKEND_PORT: 3000
  C2C_TIME_ZONE: ${C2C_TIME_ZONE:-Asia/Shanghai}
  C2C_STATIC_SERVER_URL: ${C2C_STATIC_SERVER_URL:-}
  C2C_REDIS_PREFIX: ${C2C_REDIS_PREFIX:-c2c}
  C2C_SUPER_ADMIN_UID: ${C2C_SUPER_ADMIN_UID:-1}
  C2C_SUPER_ADMIN_NAME: ${C2C_SUPER_ADMIN_NAME:-superAdmin}
  C2C_SUPER_ADMIN_PASSWORD: ${C2C_SUPER_ADMIN_PASSWORD:?C2C_SUPER_ADMIN_PASSWORD is required}
  C2C_CREDENTIAL_MASTER_KEY: ${C2C_CREDENTIAL_MASTER_KEY:?C2C_CREDENTIAL_MASTER_KEY is required}
  C2C_POSTGRES_HOST: postgres
  C2C_POSTGRES_PORT: 5432
  C2C_POSTGRES_USER: ${C2C_POSTGRES_USER:-c2c_backend}
  C2C_POSTGRES_PASSWORD: ${C2C_POSTGRES_PASSWORD:?C2C_POSTGRES_PASSWORD is required}
  C2C_POSTGRES_DB: ${C2C_POSTGRES_DB:-c2c_backend}
  C2C_REDIS_URL: redis://:${C2C_REDIS_PASSWORD:?C2C_REDIS_PASSWORD is required}@redis:6379

services:
  migrate:
    <<: *backend-image
    command: node dist/apps/migrate/main.js
    env_file: *backend-env-files
    environment: *backend-environment
    init: true
    restart: 'no'
    networks:
      - app-network
    depends_on:
      postgres:
        condition: service_healthy

  app:
    <<: *backend-image
    container_name: c2c-backend
    env_file: *backend-env-files
    init: true
    restart: unless-stopped
    ports:
      - '127.0.0.1:${C2C_BACKEND_PORT:-3000}:3000'
    environment: *backend-environment
    volumes:
      - ${C2C_BACKEND_LOG_DIR:-./volumes/logs}:/app/logs
      - ${C2C_BACKEND_STATIC_DIR:-./volumes/static}:/app/dist/apps/static
    networks:
      - app-network
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/v1/auth/captcha').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  postgres:
    image: postgres:16.10-alpine
    container_name: c2c-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${C2C_POSTGRES_USER:-c2c_backend}
      POSTGRES_PASSWORD: ${C2C_POSTGRES_PASSWORD:?C2C_POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${C2C_POSTGRES_DB:-c2c_backend}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
    shm_size: 256mb
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

  redis:
    # Production persistence uses RDB format 14; do not downgrade below Redis 8.8.
    image: redis:8.8.1-alpine
    container_name: c2c-redis
    restart: unless-stopped
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${C2C_REDIS_PASSWORD:?C2C_REDIS_PASSWORD is required}
    volumes:
      - ./volumes/redis_data:/data
    networks:
      - app-network
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: '5'

networks:
  app-network:
    driver: bridge
